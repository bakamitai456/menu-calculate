<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed Costs — Menu Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"></div>
        <div class="sidebar-title">Menu Calculator</div>
        <button class="sidebar-collapse-btn" id="sidebarToggleBtn" title="Collapse">‹</button>
      </div>
      <div class="sidebar-nav">
        <a href="index.html" class="sidebar-nav-item" title="Dashboard"><span>▤</span><span class="nav-label">Dashboard</span></a>
        <a href="ingredients.html" class="sidebar-nav-item" title="Ingredients"><span>☰</span><span class="nav-label">Ingredients</span></a>
        <a href="fixed-costs.html" class="sidebar-nav-item active" title="Fixed Costs"><span>฿</span><span class="nav-label">Fixed Costs</span></a>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-settings-btn" id="settingsOpenBtn"><span>⚙</span><span class="nav-label">Settings</span></button>
      </div>
    </div>
    <div class="main-content">
      <div class="page-inner">
    <section>
      <div class="page-header">
        <h2>Fixed Costs</h2>
        <button class="btn btn-primary" id="showFcAddBtn">+ Add Fixed Cost Item</button>
      </div>
      <div class="card">
        <div style="overflow-x:auto">
          <table class="data-table" id="fcTable" style="min-width:840px">
            <thead>
              <tr>
                <th>Name</th><th class="text-right">Bulk Qty</th><th>Unit</th><th class="text-right">Bulk ฿</th><th class="text-right">Cost/Unit</th><th class="text-right">Auto-Add Qty</th><th></th>
              </tr>
            </thead>
            <tbody id="fcBody"></tbody>
          </table>
        </div>
      </div>
      <form id="fcAddForm" class="add-row-card" style="display:none">
        <input name="name" placeholder="Name" required>
        <input name="bulkQty" type="number" min="0.001" step="any" placeholder="Qty" required>
        <input name="bulkUnit" placeholder="Unit" required>
        <input name="bulkPrice" type="number" min="0" step="any" placeholder="Price (฿)" required>
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
        <button type="button" class="btn btn-ghost btn-sm" id="cancelFcBtn">Cancel</button>
      </form>
      <div class="error-msg" id="fcError"></div>
    </section>
      </div>
    </div>
  </div>

  <!-- BULK UPDATE OVERLAY -->
  <div class="modal-backdrop" id="bulkOverlay">
    <div class="modal" style="text-align:center">
      <p style="margin:0">Updating menus…</p>
    </div>
  </div>

  <!-- BULK ACTION CONFIRM MODAL -->
  <div class="modal-backdrop" id="bulkConfirmModal">
    <div class="modal" style="text-align:center">
      <p id="bulkConfirmMessage"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="bulkConfirmCancel">Cancel</button>
        <button class="btn btn-primary" id="bulkConfirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div class="panel-backdrop" id="settingsBackdrop"></div>
  <div class="panel panel-right" id="settingsPanel" style="width:380px">
    <div class="panel-header">
      <h2>Settings</h2>
      <button class="panel-close-btn" id="settingsCloseBtn">✕</button>
    </div>
    <div class="panel-body">
      <div class="settings-section-label">Delivery MDR (%)</div>
      <input type="number" id="mdrInput" min="0" max="100" step="0.1" class="settings-input">

      <div class="settings-section-label">Google Sheets Sync</div>
      <input type="url" id="syncUrlInput" placeholder="Apps Script Web App URL" class="settings-input" style="margin-bottom:20px">
      <div class="settings-sync-actions">
        <button class="btn btn-ghost btn-sm" id="syncDownloadBtn">Download</button>
        <button class="btn btn-ghost btn-sm" id="syncUploadBtn">Upload</button>
      </div>

      <div class="settings-section-label">Data</div>
      <div class="settings-data-row">
        <button class="btn btn-ghost" id="exportBtn">Export</button>
        <button class="btn btn-ghost" id="importBtn">Import</button>
      </div>
    </div>
  </div>

  <!-- SYNC LOADING OVERLAY -->
  <div class="modal-backdrop" id="syncOverlay">
    <div class="modal" style="text-align:center">
      <div class="spinner"></div>
      <p id="syncOverlayText" style="margin:14px 0 0">Downloading…</p>
    </div>
  </div>

  <!-- SYNC CONFIRM MODAL -->
  <div class="modal-backdrop" id="syncConfirmModal">
    <div class="modal" style="text-align:center">
      <p id="syncConfirmMessage"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="syncConfirmCancel">Cancel</button>
        <button class="btn btn-primary" id="syncConfirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/pages/fixedCosts.js"></script>
</body>
</html>
