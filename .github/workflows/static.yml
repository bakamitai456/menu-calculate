# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache-bust static assets
        run: |
          VERSION="${GITHUB_SHA::8}"
          echo "Stamping cache-busting version: $VERSION"
          for f in index.html ingredients.html fixed-costs.html; do
            sed -i -E "s#(src=\"[^\"]+\.js)\"#\1?v=$VERSION\"#g" "$f"
            sed -i -E "s#(href=\"[^\"]+\.css)\"#\1?v=$VERSION\"#g" "$f"
          done
          find src -name '*.js' -print0 | xargs -0 sed -i -E "s#from '(\.[^']+\.js)'#from '\1?v=$VERSION'#g"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
