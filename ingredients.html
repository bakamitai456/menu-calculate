<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredients — Menu Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"></div>
        <div class="sidebar-title">Menu Calculator</div>
        <button class="sidebar-collapse-btn" id="sidebarToggleBtn" title="Collapse">‹</button>
      </div>
      <div class="sidebar-nav">
        <a href="index.html" class="sidebar-nav-item"><span>▤</span><span class="nav-label">Dashboard</span></a>
        <a href="ingredients.html" class="sidebar-nav-item active"><span>☰</span><span class="nav-label">Ingredients</span></a>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-sync-row">
          <span class="sidebar-sync-dot" id="sidebarSyncDot" data-status="idle"></span>
          <span class="nav-label">Synced</span>
        </div>
        <button class="sidebar-settings-btn" id="settingsOpenBtn"><span>⚙</span><span class="nav-label">Settings</span></button>
      </div>
    </div>
    <div class="main-content">
      <div class="page-inner">
    <section>
      <h2>Ingredients</h2>
      <table id="ingTable">
        <thead>
          <tr>
            <th>Name</th><th>Bulk Qty</th><th>Unit</th><th>Bulk Price (฿)</th><th>Cost / Unit (฿)</th><th></th>
          </tr>
        </thead>
        <tbody id="ingBody"></tbody>
      </table>
      <div class="add-row mt-2">
        <button class="btn btn-primary btn-sm" id="showAddBtn">+ Add Ingredient</button>
        <form id="addForm" style="display:none">
          <input name="name" placeholder="Name" required>
          <input name="bulkQty" type="number" min="0.001" step="any" placeholder="Qty" required>
          <input name="bulkUnit" placeholder="Unit (g/ml/pcs)" required>
          <input name="bulkPrice" type="number" min="0" step="any" placeholder="Price (฿)" required>
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelAddBtn">Cancel</button>
        </form>
        <div class="error-msg" id="addError"></div>
      </div>
    </section>
      </div>
    </div>
  </div>
  <!-- CONFLICT MODAL -->
  <div class="modal-backdrop" id="conflictModal">
    <div class="modal conflict-modal">
      <h2>Sync Conflict</h2>
      <p class="conflict-subtitle">This item was changed on both devices since the last sync.</p>
      <div class="conflict-counter" id="conflictCounter"></div>
      <div class="conflict-sides">
        <div class="conflict-side">
          <div class="conflict-side-label">Local (this device)</div>
          <pre id="conflictLocal" class="conflict-data"></pre>
        </div>
        <div class="conflict-side">
          <div class="conflict-side-label">Remote (Google Sheet)</div>
          <pre id="conflictRemote" class="conflict-data"></pre>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="conflictKeepLocal">Keep Local</button>
        <button class="btn btn-primary" id="conflictKeepRemote">Keep Remote</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/pages/ingredients.js"></script>
</body>
</html>
