<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Menu Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"></div>
        <div class="sidebar-title">Menu Calculator</div>
        <button class="sidebar-collapse-btn" id="sidebarToggleBtn" title="Collapse">‹</button>
      </div>
      <div class="sidebar-nav">
        <a href="index.html" class="sidebar-nav-item active" title="Dashboard"><span>▤</span><span class="nav-label">Dashboard</span></a>
        <a href="ingredients.html" class="sidebar-nav-item" title="Ingredients"><span>☰</span><span class="nav-label">Ingredients</span></a>
        <a href="fixed-costs.html" class="sidebar-nav-item" title="Fixed Costs"><span>฿</span><span class="nav-label">Fixed Costs</span></a>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-settings-btn" id="settingsOpenBtn"><span>⚙</span><span class="nav-label">Settings</span></button>
      </div>
    </div>
    <div class="main-content main-content-fixed">
      <div class="page-inner page-inner-fixed">
    <!-- MENUS SECTION -->
    <section class="menu-section">
      <div class="page-header">
        <h2>Menus</h2>
        <button class="btn btn-primary" id="addMenuBtn">+ Add Menu</button>
      </div>
      <div class="filter-bar" id="menuFilterBar">
        <input type="text" id="menuNameFilter" class="filter-input" placeholder="Search by name…">

        <div class="ms-dropdown" id="ingFilterDropdown">
          <button type="button" class="ms-dropdown-toggle" id="ingFilterToggle">
            <span>Ingredients</span>
            <span class="ms-count" id="ingFilterCount" style="display:none"></span>
            <span class="ms-caret">▾</span>
          </button>
          <div class="ms-dropdown-panel" id="ingFilterPanel">
            <input type="text" class="ms-search" id="ingFilterSearch" placeholder="Search ingredients…">
            <div class="ms-options" id="ingFilterOptions"></div>
          </div>
        </div>

        <div class="ms-dropdown" id="fcFilterDropdown">
          <button type="button" class="ms-dropdown-toggle" id="fcFilterToggle">
            <span>Fixed Costs</span>
            <span class="ms-count" id="fcFilterCount" style="display:none"></span>
            <span class="ms-caret">▾</span>
          </button>
          <div class="ms-dropdown-panel" id="fcFilterPanel">
            <input type="text" class="ms-search" id="fcFilterSearch" placeholder="Search fixed costs…">
            <div class="ms-options" id="fcFilterOptions"></div>
          </div>
        </div>

        <button type="button" class="btn-link" id="clearFiltersBtn" style="display:none">Clear filters</button>
      </div>
      <div id="menuGrid" class="menu-list-scroll"></div>
    </section>
      </div>
    </div>
  </div>

  <!-- FLOATING QUICK-ADD MENU BAR -->
  <div class="fab-bar" id="fabBar">
    <button class="fab-btn" id="fabAddMenuBtn"><span class="fab-btn-icon">+</span> Menu</button>
  </div>

  <!-- MENU PANEL -->
  <div class="panel-backdrop" id="menuModalBackdrop"></div>
  <div class="panel panel-right" id="menuModal">
    <div class="panel-header">
      <h2 id="modalTitle">Add Menu</h2>
      <button class="panel-close-btn" id="cancelMenuBtn">✕</button>
    </div>
    <div class="panel-body">
      <input type="hidden" id="menuId">

      <label>Menu Name</label>
      <input type="text" id="menuName" placeholder="e.g. Pad Thai">

      <label>Ingredients</label>
      <div class="row-list" id="ingRows"></div>
      <button class="btn btn-ghost btn-sm mt-2" id="addIngRowBtn">+ Add Ingredient</button>
      <div style="margin-top:6px">
        <button class="btn-link" id="quickAddIngBtn">＋ New ingredient (quick add)</button>
      </div>
      <div class="quick-add-form" id="quickAddForm" style="display:none">
        <div class="form-row">
          <input name="name" placeholder="Name">
          <input name="bulkQty" type="number" min="0.001" step="any" placeholder="Qty">
          <input name="bulkUnit" placeholder="Unit">
          <input name="bulkPrice" type="number" min="0" step="any" placeholder="Price (฿)">
          <button type="button" class="btn btn-primary btn-sm" id="saveQuickIngBtn">Add</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelQuickIngBtn">Cancel</button>
        </div>
        <div class="error-msg" id="quickIngError"></div>
      </div>

      <label>Fixed Cost Items</label>
      <div class="row-list" id="fcRows"></div>
      <button class="btn btn-ghost btn-sm mt-2" id="addFcRowBtn">+ Add Fixed Cost Item</button>

      <label>Front-Store Selling Price (฿)</label>
      <input type="number" id="frontPrice" min="0" step="any" placeholder="0.00">

      <label>Delivery Selling Price (฿)</label>
      <input type="number" id="deliveryPrice" min="0" step="any" placeholder="0.00">

      <div class="error-msg" id="menuError"></div>
    </div>
    <div class="menu-panel-footer">
      <div class="preview-box" id="previewBox">
        <h4>Live Preview</h4>
        <div id="previewContent" style="color:rgba(42,31,22,.4);font-size:12px">Fill in ingredients and prices to see profit.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelMenuBtnFooter">Cancel</button>
        <button class="btn btn-primary" id="saveMenuBtn">Save Menu</button>
      </div>
    </div>
  </div>

  <!-- SYNC LOADING OVERLAY -->
  <div class="modal-backdrop" id="syncOverlay">
    <div class="modal" style="text-align:center">
      <div class="spinner"></div>
      <p id="syncOverlayText" style="margin:14px 0 0">Downloading…</p>
    </div>
  </div>

  <!-- SYNC CONFIRM MODAL -->
  <div class="modal-backdrop" id="syncConfirmModal">
    <div class="modal" style="text-align:center">
      <p id="syncConfirmMessage"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="syncConfirmCancel">Cancel</button>
        <button class="btn btn-primary" id="syncConfirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div class="panel-backdrop" id="settingsBackdrop"></div>
  <div class="panel panel-right" id="settingsPanel" style="width:380px">
    <div class="panel-header">
      <h2>Settings</h2>
      <button class="panel-close-btn" id="settingsCloseBtn">✕</button>
    </div>
    <div class="panel-body">
      <div class="settings-section-label">Delivery MDR (%)</div>
      <input type="number" id="mdrInput" min="0" max="100" step="0.1" class="settings-input">

      <div class="settings-section-label">Google Sheets Sync</div>
      <input type="url" id="syncUrlInput" placeholder="Apps Script Web App URL" class="settings-input" style="margin-bottom:20px">
      <div class="settings-sync-actions">
        <button class="btn btn-ghost btn-sm" id="syncDownloadBtn">Download</button>
        <button class="btn btn-ghost btn-sm" id="syncUploadBtn">Upload</button>
      </div>

      <div class="settings-section-label">Data</div>
      <div class="settings-data-row">
        <button class="btn btn-ghost" id="exportBtn">Export</button>
        <button class="btn btn-ghost" id="importBtn">Import</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/pages/dashboard.js"></script>
</body>
</html>
